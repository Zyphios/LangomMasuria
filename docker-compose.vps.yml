name: lagommasuria-vps

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lagom
      POSTGRES_USER: lagom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lagom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@db:5432/lagom
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.vps}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env.vps}
      BOOKING_ABUSE_SECRET: ${BOOKING_ABUSE_SECRET:?Set BOOKING_ABUSE_SECRET in .env.vps}
      BOOKING_PENDING_LIMIT: ${BOOKING_PENDING_LIMIT:-1}
      BOOKING_DAILY_LIMIT: ${BOOKING_DAILY_LIMIT:-3}
      BOOKING_EMAIL_DAILY_LIMIT: ${BOOKING_EMAIL_DAILY_LIMIT:-5}
      BOOKING_EMAIL_COOLDOWN_SECONDS: ${BOOKING_EMAIL_COOLDOWN_SECONDS:-120}
      BOOKING_IP_HOURLY_LIMIT: ${BOOKING_IP_HOURLY_LIMIT:-10}
      BOOKING_IP_DAILY_LIMIT: ${BOOKING_IP_DAILY_LIMIT:-30}
      BOOKING_LINK_MINUTE_LIMIT: ${BOOKING_LINK_MINUTE_LIMIT:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.vps}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.vps}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-domeknamazurskiej@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-domeknamazurskiej@gmail.com}
      PAYU_MERCHANT_ID: stub
      PAYU_SECRET_KEY: stub
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/pricing').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.vps
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local

volumes:
  postgres_data:
