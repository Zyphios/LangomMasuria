services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lagom
      POSTGRES_USER: lagom
      POSTGRES_PASSWORD: lagom_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://lagom:lagom_pass@db:5432/lagom
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      BOOKING_ABUSE_SECRET: ${BOOKING_ABUSE_SECRET:?Set BOOKING_ABUSE_SECRET in .env}
      BOOKING_PENDING_LIMIT: ${BOOKING_PENDING_LIMIT:-1}
      BOOKING_DAILY_LIMIT: ${BOOKING_DAILY_LIMIT:-3}
      BOOKING_EMAIL_DAILY_LIMIT: ${BOOKING_EMAIL_DAILY_LIMIT:-5}
      BOOKING_EMAIL_COOLDOWN_SECONDS: ${BOOKING_EMAIL_COOLDOWN_SECONDS:-120}
      BOOKING_IP_HOURLY_LIMIT: ${BOOKING_IP_HOURLY_LIMIT:-10}
      BOOKING_IP_DAILY_LIMIT: ${BOOKING_IP_DAILY_LIMIT:-30}
      BOOKING_LINK_MINUTE_LIMIT: ${BOOKING_LINK_MINUTE_LIMIT:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-domeknamazurskiej@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-domeknamazurskiej@gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lagommasuria.pl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Lagom123!}
      PAYU_MERCHANT_ID: stub
      PAYU_SECRET_KEY: stub
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.cjs:/app/postcss.config.cjs
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

volumes:
  postgres_data:
