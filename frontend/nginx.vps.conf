map $http_accept $webp_suffix {
    default "";
    "~*image/webp" ".webp";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        client_max_body_size 12m;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Zdjęcia: przeglądarkom z WEBP podajemy lżejszy plik .webp pod nazwą oryginału
    location ~* ^(?<imgbase>.+)\.(jpg|jpeg|png)$ {
        add_header Vary Accept;
        add_header Cache-Control "no-cache";
        try_files $imgbase$webp_suffix $uri =404;
    }

    location ~* \.(gif|webp|svg|ico|woff|woff2)$ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = / {
        try_files /home.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /admin {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Podstrony wstępnie wyrenderowane w buildzie (house.html itd.), reszta -> SPA
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(verify-booking|booking-decision)$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
